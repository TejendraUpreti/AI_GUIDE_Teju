<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lessons | AI Guide</title><link rel="stylesheet" href="style.css"></head>
<body><header class="nav"><a class="logo" href="index.html">✦ <span>AI Guide</span></a><nav><a href="index.html">Home</a><a class="active" href="lessons.html">Lessons</a><a href="practice.html">Practice</a></nav><button id="theme" class="theme">☾</button></header>
<main class="wrap page">
 <div class="crumb">HOME / LESSONS</div><div class="section-title"><span>STEP 1</span><h1>Choose a Lesson</h1><p>Start from the top or jump to any topic.</p></div>
 <div id="lessonGrid" class="lesson-grid"></div>
</main>
<div id="aiAssistant" class="ai-assistant">
  <button id="aiToggle" class="ai-fab" aria-label="Open AI Assistant">🤖</button>
  <section id="aiPanel" class="ai-panel" aria-hidden="true">
    <div class="ai-head"><div><b>AI Assistant</b><small>Ask anything about your lesson</small></div><button id="aiClose" class="ai-close">×</button></div>
    <div id="aiMessages" class="ai-messages"><div class="ai-msg bot">Hi! 👋 Ask me about AI, ChatGPT, Python, SQL, prompts, or anything in this course.</div></div>
    <div class="ai-quick"><button data-q="Explain this topic in simple Hindi">Simple Hindi</button><button data-q="Give me a practical example">Example</button><button data-q="Quiz me on this topic">Quiz me</button></div>
    <form id="aiForm" class="ai-form"><textarea id="aiInput" rows="2" placeholder="Ask your question..." required></textarea><button class="btn primary" type="submit">Send</button></form>
    <div class="ai-status" id="aiStatus">AI Assistant</div>
  </section>
</div>

<footer>✦ AI Guide <span>Lessons → Topics → Practice</span></footer><script src="app.js"></script><script src="ai.js"></script><script src="lessons.js"></script></body></html>
